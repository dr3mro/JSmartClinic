name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install WiX (Windows installer tooling)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Verify
        shell: bash
        run: ./mvnw -B verify

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: ./mvnw -B -Ppackage-mac -DskipTests package

      - name: Package Windows EXE
        if: runner.os == 'Windows'
        shell: bash
        run: ./mvnw -B -Ppackage-win -DskipTests package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JSmartClinic-${{ runner.os }}
          path: target/dist/*
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: target/site/jacoco
          if-no-files-found: warn
