name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.2.0 publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            profile: package-mac
            label: macOS-arm64
            distribution: temurin
            java-package: jdk
            fx: ""
          - os: windows-latest
            profile: package-win
            label: Windows-x64
            distribution: temurin
            java-package: jdk
            fx: ""
          # Windows ARM64 is not built: neither Maven Central nor Azul publishes JavaFX for
          # win-aarch64 (checked 2026-11-03). The x64 installer runs on Windows ARM via emulation.
          # When a JDK with JavaFX for win-aarch64 exists, add an entry with os: windows-11-arm
          # and fx: "-Djavafx.bundled=true" (the pom already supports it).

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-package: ${{ matrix.java-package }}
          java-version: "25"
          cache: maven

      - name: Install WiX (Windows installer tooling)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Work out the app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # jpackage needs a numeric version; use the run number for non-release builds
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Verify (compile + tests + coverage)
        shell: bash
        run: ./mvnw -B verify ${{ matrix.fx }}

      - name: Package installer
        shell: bash
        run: ./mvnw -B -P${{ matrix.profile }} ${{ matrix.fx }} -DskipTests -Dapp.version=${{ steps.version.outputs.version }} package

      - name: Name installer by platform
        shell: bash
        run: |
          cd target/dist
          for f in *; do mv "$f" "${f%.*}-${{ matrix.label }}.${f##*.}"; done
          ls -l

      - name: Upload installer (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JSmartClinic-${{ matrix.label }}-${{ steps.version.outputs.version }}
          path: target/dist/*
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.label }}
          path: target/site/jacoco
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: verify-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: JSmartClinic-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
