name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.2.0 publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            profile: package-mac
            label: macOS-arm64
            distribution: temurin
            java-package: jdk
            fx: ""
          - os: windows-latest
            profile: package-win
            label: Windows-x64
            distribution: temurin
            java-package: jdk
            fx: ""
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-package: ${{ matrix.java-package }}
          java-version: "25"
          cache: maven

      - name: Install WiX (Windows installer tooling)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Work out the app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # jpackage needs a numeric version; use the run number for non-release builds
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Verify (compile + tests + coverage)
        shell: bash
        run: ./mvnw -B verify ${{ matrix.fx }}

      - name: Package installer
        shell: bash
        run: ./mvnw -B -P${{ matrix.profile }} ${{ matrix.fx }} -DskipTests -Dapp.version=${{ steps.version.outputs.version }} package

      - name: Name installer by platform
        shell: bash
        run: |
          cd target/dist
          for f in *; do mv "$f" "${f%.*}-${{ matrix.label }}.${f##*.}"; done
          ls -l

      - name: Upload installer (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JSmartClinic-${{ matrix.label }}-${{ steps.version.outputs.version }}
          path: target/dist/*
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.label }}
          path: target/site/jacoco
          if-no-files-found: warn

  windows-arm64:
    # Neither Maven Central nor Azul ships JavaFX for win-aarch64, so build OpenJFX from
    # source on an ARM runner, link it into a JDK, and package with -Djavafx.bundled.
    # Experimental: a failure here never blocks the macOS/Windows x64 release.
    name: Package (Windows-arm64, OpenJFX from source)
    runs-on: windows-11-arm
    continue-on-error: true
    env:
      JFX_REPO: openjdk/jfx25u     # OpenJFX 25 update releases
      JFX_REF: master
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25 (ARM64)
        uses: actions/setup-java@v5
        with:
          distribution: zulu        # Temurin has no JDK 25 for Windows ARM64; Zulu does
          java-version: "25"
          architecture: aarch64
          cache: maven

      - name: Work out the app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore cached OpenJFX build
        id: jfx-cache
        uses: actions/cache@v4
        with:
          path: jfx/build/jmods
          key: openjfx-win-aarch64-${{ env.JFX_REPO }}-${{ env.JFX_REF }}-v1

      - name: Set up JDK 23 for the OpenJFX build (Gradle 8.14 cannot run on JDK 25)
        id: jdk23
        if: steps.jfx-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          architecture: aarch64

      - name: Install OpenJFX build tools
        if: steps.jfx-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ant ninja cmake --no-progress -y

      - name: Build OpenJFX for Windows ARM64
        if: steps.jfx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$JFX_REF" "https://github.com/$JFX_REPO.git" jfx
          cd jfx
          # OpenJFX's win.gradle needs VSCOMNTOOLS = <VS install>\VC\Auxiliary\Build
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_PATH=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath)
          if [ -z "$VS_PATH" ]; then VS_PATH=$("$VSWHERE" -latest -products '*' -property installationPath); fi
          echo "Visual Studio: $VS_PATH"
          export VSCOMNTOOLS="$VS_PATH\VC\Auxiliary\Build"
          ls "$(cygpath -u "$VSCOMNTOOLS" 2>/dev/null || echo "$VSCOMNTOOLS")" | head
          export JAVA_HOME="${{ steps.jdk23.outputs.path }}"
          "$JAVA_HOME/bin/java" -version
          ./gradlew.bat --no-daemon sdk jmods
          ls build/jmods

      - name: Re-select JDK 25 (ARM64)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          architecture: aarch64

      - name: Link a JDK that includes JavaFX
        shell: bash
        run: |
          MODS=$("$JAVA_HOME/bin/java" --list-modules | sed 's/@.*//' | paste -sd, -)
          MP="jfx/build/jmods"
          if [ -d "$JAVA_HOME/jmods" ]; then MP="$JAVA_HOME/jmods;$MP"; fi
          "$JAVA_HOME/bin/jlink" --module-path "$MP" --add-modules "$MODS,ALL-MODULE-PATH" \
            --output "$RUNNER_TEMP/jdk-fx"
          "$RUNNER_TEMP/jdk-fx/bin/java" --list-modules | grep javafx
          # jpackage runs jlink inside this JDK; a jlinked image can only re-link from jmods,
          # so ship the JDK's own jmods plus the JavaFX jmods next to it.
          if [ ! -d "$JAVA_HOME/jmods" ]; then echo "::error::$JAVA_HOME has no jmods folder"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/jdk-fx/jmods"
          cp "$JAVA_HOME"/jmods/*.jmod jfx/build/jmods/*.jmod "$RUNNER_TEMP/jdk-fx/jmods/"
          ls "$RUNNER_TEMP/jdk-fx/jmods" | grep -E "java.base|javafx"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-fx" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-fx/bin" >> "$GITHUB_PATH"

      - name: Install WiX
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Verify
        shell: bash
        run: ./mvnw -B -Djavafx.bundled=true verify

      - name: Package installer
        shell: bash
        run: ./mvnw -B -Ppackage-win -Djavafx.bundled=true -DskipTests -Dapp.version=${{ steps.version.outputs.version }} package

      - name: Name installer by platform
        shell: bash
        run: |
          cd target/dist
          for f in *; do mv "$f" "${f%.*}-Windows-arm64.${f##*.}"; done
          ls -l

      - name: Upload installer (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JSmartClinic-Windows-arm64-${{ steps.version.outputs.version }}
          path: target/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify-and-package, windows-arm64]
    # Publish even if the experimental ARM64 job failed; its installer is simply omitted.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.verify-and-package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: JSmartClinic-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
